version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    # Skip fresh releases (supply-chain safety); security updates ignore cooldown.
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
      major:
        update-types: ["major"]
    commit-message:
      prefix: "chore(deps)"
  - package-ecosystem: "uv"
    directory: "/backend"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    # Skip fresh releases (supply-chain safety); security updates ignore cooldown.
    cooldown:
      default-days: 7
      semver-major-days: 30
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
      major:
        update-types: ["major"]
    commit-message:
      prefix: "chore(deps)"
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    # Skip fresh releases (supply-chain safety); security updates ignore cooldown.
    cooldown:
      default-days: 7
      semver-major-days: 30
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
      major:
        update-types: ["major"]
    commit-message:
      prefix: "chore(deps)"
  - package-ecosystem: "docker"
    directory: "/backend"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    # Skip fresh releases (supply-chain safety); security updates ignore cooldown.
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
      major:
        update-types: ["major"]
    commit-message:
      prefix: "chore(deps)"
  - package-ecosystem: "docker"
    directory: "/frontend"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    # Skip fresh releases (supply-chain safety); security updates ignore cooldown.
    cooldown:
      default-days: 7
    # Stay on the Node LTS line: majors are bumped manually when the next LTS ships.
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
      major:
        update-types: ["major"]
    commit-message:
      prefix: "chore(deps)"
