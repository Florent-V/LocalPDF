name: Dependency audit

# Known-vulnerability scan of the locked dependencies (frontend + backend).
# Also runs weekly: new advisories appear without any change in the repo.
on:
  push:
    branches: [main]
    paths:
      - frontend/package.json
      - frontend/pnpm-lock.yaml
      - backend/pyproject.toml
      - backend/uv.lock
      - .github/workflows/audit.yml
  pull_request:
    paths:
      - frontend/package.json
      - frontend/pnpm-lock.yaml
      - backend/pyproject.toml
      - backend/uv.lock
      - .github/workflows/audit.yml
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (pnpm)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.17.0
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: ./frontend/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: ./frontend
        run: pnpm install --frozen-lockfile
      - name: Audit (fails on high and critical)
        working-directory: ./frontend
        run: pnpm audit --audit-level high

  backend:
    name: Backend (uv + pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: ./backend/uv.lock
      - name: Audit (locked runtime dependencies, fails on any known vulnerability)
        working-directory: ./backend
        run: |
          uv export --frozen --no-dev --no-emit-project --no-hashes -o "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit==2.10.1 -r "$RUNNER_TEMP/requirements.txt" --no-deps --disable-pip
