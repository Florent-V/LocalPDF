[project]
name = "localpdf-backend"
version = "0.1.0"
description = "LocalPDF backend (FastAPI)"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.162.0",
    "uvicorn[standard]==0.32.0",
    "python-multipart==0.0.33",
    "pydantic-settings==2.6.1",
    "pymupdf==1.24.13",
    "pypdf==6.21.4",
    "pikepdf==9.4.0",
    "pdf2docx==0.5.8",
    "pymupdf4llm==0.0.17",
    "markdown==3.11.2",
    "xhtml2pdf==0.2.28",
    "ollama==0.4.5",
    "openai==3.42.1",
    "anthropic==0.45.0",
    "python-magic==0.4.27",
    "httpx==0.27.2",
    "PyJWT[crypto]==2.15.1",
    "authlib==1.9.1",
    "slowapi==0.1.10",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.17.3",
]

[tool.uv]
# Application, not a library: nothing to build/install, only dependencies.
package = false

[tool.pytest.ini_options]
testpaths = ["app/tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
# E501: no formatter enforced. B008: FastAPI Depends()/File()/Form() idiom.
ignore = ["E501", "B008", "B904", "UP047"]

[tool.ruff.lint.per-file-ignores]
"app/tests/**" = ["S101", "S110", "S105", "S106", "S603", "S607", "S608", "B017"]
"app/auth/**" = ["S106", "S608"]
