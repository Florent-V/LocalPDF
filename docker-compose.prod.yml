# Production: make prod-up (uses .env.prod). Standalone file, not an override of
# docker-compose.yml: no source mounts, no hot reload, built images.
#
# `web` (Caddy: static front + routing) is the only reachable container, on
# 127.0.0.1: the host's Caddy does the HTTPS. `api` publishes no port; it is the
# OAuth client and only `web` (and, through it, the OAuth server's back-channel
# logout call) reaches it.
services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: localpdf-api:${IMAGE_TAG:-latest}
    container_name: localpdf-api
    # api is only reachable from web, so trusting its forwarded headers is safe.
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips=*
    expose:
      - "8000"
    environment:
      - MAX_UPLOAD_MB=${MAX_UPLOAD_MB:-200}
      - OAUTH_ISSUER=${OAUTH_ISSUER}
      - OAUTH_CLIENT_ID=${OAUTH_CLIENT_ID}
      - OAUTH_CLIENT_SECRET=${OAUTH_CLIENT_SECRET}
      - PUBLIC_ORIGIN=${PUBLIC_ORIGIN}
      - APP_ENV=prod
      - SESSION_DB_PATH=/data/sessions.db
    volumes:
      - api-data:/data
    deploy:
      resources:
        limits:
          memory: 2G
    security_opt:
      - no-new-privileges:true
    healthcheck:
      # 503 until the OAuth server's metadata has been read.
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    image: localpdf-web:${IMAGE_TAG:-latest}
    container_name: localpdf-web
    ports:
      - "${HTTP_BIND:-127.0.0.1}:${FRONTEND_PORT:-3010}:80"
    environment:
      - MAX_UPLOAD_MB=${MAX_UPLOAD_MB:-200}
    deploy:
      resources:
        limits:
          memory: 256M
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy

volumes:
  api-data:
