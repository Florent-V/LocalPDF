services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: localpdf-backend
    ports:
      - "${BACKEND_PORT:-8000}:${BACKEND_PORT:-8000}"
    environment:
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000}
      - MAX_UPLOAD_MB=${MAX_UPLOAD_MB:-200}
    deploy:
      resources:
        limits:
          memory: 2G
    volumes:
      - ./backend:/app
      - /app/__pycache__
      - /app/.venv
    command: uvicorn app.main:app --host 0.0.0.0 --port ${BACKEND_PORT:-8000} --reload
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: localpdf-frontend
    ports:
      - "${FRONTEND_PORT:-3000}:${FRONTEND_PORT:-3000}"
    environment:
      - NUXT_PUBLIC_API_BASE_URL=${NUXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
      - NUXT_PORT=${FRONTEND_PORT:-3000}
      - NUXT_HOST=0.0.0.0
      - CI=true
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.nuxt
    command: pnpm dev
    restart: unless-stopped
    depends_on:
      - backend
